        .separator-1 {

        .mic-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            position: relative;
            padding: 12px;
            width: 100%;
            border-radius: 50px;
            background-color: #1F2937;
            color: white;
            border: hidden;
        }

        .mic-button:active {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .mic-button.recording {
            background: #FF4757!important;
            width: 50px;
        }

        .mic-button svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .mic-button.recording svg {
            stroke: white;
        }

        .recording-indicator {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 8px;
            height: 8px;
            background-color: #FF4757;
            border-radius: 50%;
            display: none;
        }

        .mic-button.recording .recording-indicator {
            display: block;
            animation: pulsee 1.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes pulsee {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(255, 71, 87, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0);

        .startButton.pulsing::after {

        }

        .wait-overlay.hidden {

        }

        .big-circle {
            position: relative;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background-color: #1F2937;
            /*background: radial-gradient(circle, rgba(0, 110, 180, 0.3), rgba(0, 40, 100, 0.9)); !* Elegant soft gradient *!*/
            animation: rotate 12s linear infinite; /* Smooth, slow rotation */
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.5);
        }

        .small-circle {
            position: absolute;
            width: 35px;
            height: 35px;
            background-color: #ffffff;
            border-radius: 50%;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            /*box-shadow: 0px 12px 20px rgba(0, 0, 0, 0.8); !* Elegant glow *!*/
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        .letter {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            opacity: 0;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff; /* Softer, more elegant blue */
            text-shadow: 0px 0px 8px rgba(255, 255, 255, 0.8); /* Subtle glowing text */
            animation-fill-mode: forwards;
        }

        @keyframes flyBackward {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(1);
            }
            20% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(-170px, 60px) scale(0.8);
            }
        }

        @keyframes flyWithGravityBackward {
            0% {
                opacity: 0;
                transform: translate(0, -30px) scale(1);
            }
            20% {
                opacity: 1;
            }
            50% {
                transform: translate(-120px, 40px);
            }
            100% {
                opacity: 0;
                transform: translate(-180px, 70px) scale(0.8);
            }
        }

        /* Animate letters with different timings */
        .letter:nth-child(2) {
            animation: flyBackward 2.5s ease-out infinite 1s;
        }

        .letter:nth-child(3) {
            animation: flyWithGravityBackward 2.7s ease-out infinite 1.3s;
        }

        .letter:nth-child(4) {
            animation: flyBackward 2.9s ease-out infinite 1.6s;
        }

        .letter:nth-child(5) {
            animation: flyWithGravityBackward 3.1s ease-out infinite 1.9s;
        }

        .letter:nth-child(6) {
            animation: flyBackward 3.3s ease-out infinite 2.2s;
        }

        .letter:nth-child(7) {
            animation: flyWithGravityBackward 3.5s ease-out infinite 2.5s;
        }

        .letter:nth-child(8) {
            animation: flyBackward 3.7s ease-out infinite 2.8s;
        }

        .letter:nth-child(9) {
            animation: flyWithGravityBackward 3.9s ease-out infinite 3.1s;
        }

        .letter:nth-child(10) {
            animation: flyBackward 4.1s ease-out infinite 3.4s;
        }
    </style>

<script> //mobile nav bar control
const menuButton = document.getElementById('menuButton');
const mobileMenu = document.getElementById('mobileMenu');
const menuIcon = document.getElementById('menuIcon');
const closeIcon = document.getElementById('closeIcon');
let isMenuOpen = false;

menuButton.addEventListener('click', () => {
    isMenuOpen = !isMenuOpen;
    mobileMenu.classList.toggle('open', isMenuOpen);
    menuIcon.style.display = isMenuOpen ? 'none' : 'block';
    closeIcon.style.display = isMenuOpen ? 'block' : 'none';
});

</script>
<script>
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
            e.stopPropagation();

            const parentLangSelect = this.closest('.lang-select');
            parentLangSelect.classList.toggle('active');
        });
    });

    document.querySelectorAll('.lang-option').forEach(option => {
        option.addEventListener('click', () => {
            const langText = option.textContent.trim();
            if (langText === 'ENG') {
                switchLanguage('en');
            } else if (langText === 'ՀԱՅ') {
                switchLanguage('hy');
            }
            const parentLangSelect = option.closest('.lang-select');
            if (parentLangSelect) {
                parentLangSelect.classList.remove('active');
            }
        });
    });

    document.addEventListener('click', function (event) {
        document.querySelectorAll('.lang-select').forEach(langSelect => {
            if (!langSelect.contains(event.target)) {
                langSelect.classList.remove('active');
            }
        });
    });
</script>

<script>
    function showError(text, color) {
        const errorMessage = document.getElementById('errorMessage');
        const errorMessageMob = document.getElementById('errorMessageMob');
        errorMessage.textContent = text;
        errorMessage.style.backgroundColor = color
        errorMessage.classList.add('show');
        setTimeout(() => {
            errorMessage.classList.remove('show');
        }, 6000);
        errorMessageMob.textContent = text;
        errorMessageMob.style.backgroundColor = color
        errorMessageMob.classList.add('show');
        setTimeout(() => {
            errorMessageMob.classList.remove('show');
        }, 6000);
    }
</script>

<script>
    function createFileItem(file) {
        const date = new Date(file.recognizeDate);
        let fileClass = localStorage.getItem('theme') === 'dark' ? 'file-name-dark' : 'file-name';
        const formattedDate = `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}`;
        return `
                <div class="file-item" onclick="loadResult(${file.id})">
                    <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span class="${fileClass}">${file.name}</span>
                    <span class="file-date">${formattedDate}</span>
                </div>
            `;
    }

    function renderFiles(filesArray) {
        let fileList = document.querySelector('.file-list');
        let processedCount = document.querySelector('.processed-count');
        fileList.innerHTML = filesArray.map(file => createFileItem(file)).join('');
        processedCount.textContent = `${filesArray.length}`;
    }

    function loadResult(fileId) {
        fetch('/historyItem?id=' + encodeURIComponent(fileId))
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').value = data.result;
            });
    }
</script>


<script>
    function recognize() {
        if (isRecording) {
            showError(i18next.t("off_recording"), '#ff4d4d')
            return;
        }
        document.getElementById('startButton').classList.remove("pulsing");
        let urlInput = document.getElementById('youtube-input').value;
        const resultArea = document.getElementById('result');
        const fileInput = document.getElementById("fileInput");

        if (urlInput) {
            if (document.getElementById("video-preview").innerHTML === "") {
                showError(i18next.t("error_invalid_link"), '#ff4d4d')
            } else {
                showWaitPanel();
                fetch('/recognizeByURL?url=' + encodeURIComponent(urlInput) + '&language=' + encodeURIComponent(language))
                    .then(response => response.json())
                    .then(data => {
                        hideWaitPanel();
                        if (data.errorMessage) {
                            showError(i18next.t(data.errorMessage), '#ff4d4d')
                        } else {
                            resultArea.value = data.recognition;
                        }
                        if (data.userInfo) {
                            const seconds = data.userInfo.availableSeconds;
                            if (seconds >= 0) {
                                timeInfo.textContent = `${Math.floor(seconds / 60)}`;
                            }
                            fileHistory = data.userInfo.recognizeHistory
                            renderFiles(data.userInfo.recognizeHistory);
                        }
                    })
                    .catch(error => {
                        showError(i18next.t(error), '#ff4d4d')
                        hideWaitPanel();
                    });
            }
        } else if (fileInput.files.length !== 0) {
            showWaitPanel();
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('language', language);

            fetch('/recognizeByMediaFile', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    hideWaitPanel();
                    if (data.errorMessage) {
                        showError(i18next.t(data.errorMessage), '#ff4d4d')
                    } else {
                        resultArea.value = data.recognition;
                    }
                    if (data.userInfo) {
                        const seconds = data.userInfo.availableSeconds;
                        fileHistory = data.userInfo.recognizeHistory
                        renderFiles(data.userInfo.recognizeHistory);
                        if (seconds >= 0) {
                            timeInfo.textContent = `${Math.floor(seconds / 60)}`;
                        }
                    }
                })
                .catch(error => {
                    showError(i18next.t(error), '#ff4d4d')
                    hideWaitPanel();
                });
        } else {
            showError((i18next.t("error_no_input")), '#ff4d4d')
        }
    }
</script>

<script>
    async function docExport() {
        const text = document.getElementById('result').value;

        if (!text) {
            showError(i18next.t("error_nothing_to_export"), '#ff4d4d');
            return;
        }

        // Создаем новый документ Word
        const doc = new docx.Document({
            sections: [{
                properties: {},
                children: [
                    new docx.Paragraph({
                        children: [
                            new docx.TextRun({
                                text: text,
                                font: "Arial"
                            })
                        ]
                    })
                ]
            }]
        });

        // Конвертируем документ в Blob
        docx.Packer.toBlob(doc).then(blob => {
            // Создаем ссылку для скачивания
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Recognition.docx';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    }

<script> // on url input
document.getElementById("youtube-input").addEventListener("input", function () {
    const url = this.value;
    const videoPreview = document.getElementById("video-preview");
    let videoId = extractYouTubeVideoId(url);
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    fileInput.value = "";
    fileName.textContent = "";
    document.getElementById("placeholder").style.display = "block";

    if (videoId) {
        document.getElementById('startButton').classList.add("pulsing");
        videoPreview.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
        videoPreview.style.display = "flex";
    } else {
        videoId = null;
        try {
            const parsed = new URL(url);
            const host = parsed.hostname;
            if (!/(facebook\.com|fb\.watch)$/.test(host)) {
                document.getElementById('startButton').classList.remove("pulsing");
                videoPreview.style.display = "none";
                videoPreview.innerHTML = "";
                return;
            }
            const numericPatterns = [
                /\/videos\/(\d+)/,                       // /username/videos/{video_id}/ или /groups/.../videos/{video_id}/
                /video\.php.*[?&](?:v|video_id)=(\d+)/,     // video.php?v={video_id} или video.php?video_id={video_id}
                /\/watch(?:\/.*)?[?&]v=(\d+)/,                         // /watch или /watch/... с параметром v={video_id}
                /story\.php.*[?&]video_id=(\d+)/             // story.php?video_id={video_id}
            ];

            for (const pattern of numericPatterns) {
                const match = pattern.exec(url);
                if (match && match[1]) {
                    videoId = match[1];
                    break;
                }
            }

            // Если числовой идентификатор не найден, пробуем извлечь короткий (алфавитно-цифровой) код
            if (!videoId) {
                const shortPattern = /\/share\/v\/([^/]+)/; // /share/v/{short_code}/
                const match = shortPattern.exec(url);
                if (match && match[1]) {
                    videoId = match[1];
                }
            }
            if (!videoId && parsed.hostname === "fb.watch") {
                videoId = parsed.pathname.replace(/\//g, '');
            }
            // Если идентификатор найден, определяем его тип
            if (videoId) {
                if (/^\d+$/.test(videoId)) {
                    const embedUrl = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(
                        `https://www.facebook.com/facebook/videos/${videoId}/`
                    )}`;
                    document.getElementById('startButton').classList.add("pulsing");
                    videoPreview.innerHTML = `<iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>`;
                    videoPreview.style.display = "flex";
                } else {
                    document.getElementById('startButton').classList.add("pulsing");
                    videoPreview.innerHTML = '<div class="spinner"></div>';
                    videoPreview.style.display = "flex";

                    fetch('/fbVideoPreview?url=' + encodeURIComponent(url))
                        .then(response => response.json())
                        .then(data => {
                            const previewUrl = data.result;
                            if (previewUrl) {
                                document.getElementById('startButton').classList.add("pulsing");
                                videoPreview.innerHTML = `<iframe src="${previewUrl}" frameborder="0" allowfullscreen></iframe>`;
                                videoPreview.style.display = "flex";
                            } else {
                                showError(i18next.t("error_invalid_link"), '#ff4d4d')
                                document.getElementById('startButton').classList.remove("pulsing");
                                videoPreview.style.display = "none";
                                videoPreview.innerHTML = "";
                            }
                        })
                }
            } else {
                document.getElementById('startButton').classList.remove("pulsing");
                videoPreview.style.display = "none";
                videoPreview.innerHTML = "";
            }
        } catch (error) {
            document.getElementById('startButton').classList.remove("pulsing");
            videoPreview.style.display = "none";
            videoPreview.innerHTML = "";
        }
    }
});

function extractYouTubeVideoId(url) {
    const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
}
